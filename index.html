<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重心系・相対運動ビジュアライザー</title>
    <meta name="description" content="物理教育用シミュレーター：重心系と相対運動を視覚的に学ぶ">
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@8/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
        }

        /* 大画面（教室のプロジェクター等）では全体を少し大きく */
        @media (min-width: 1536px) and (min-height: 860px) {
            html {
                font-size: 18px;
            }
        }

        body {
            margin: 0;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            color: #fff;
            font-family: system-ui, 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', sans-serif;
        }

        .glass {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .toggle-btn {
            transition: all 0.15s ease;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.45);
        }

        .snap-point {
            position: absolute;
            width: 3px;
            height: 10px;
            background: #94a3b8;
            border-radius: 2px;
            transform: translateX(-50%);
        }

        .snap-label {
            position: absolute;
            font-size: 12px;
            line-height: 1;
            color: #cbd5e1;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        canvas {
            display: block;
            touch-action: none;
            user-select: none;
        }

        .energy-bar {
            height: 100%;
            border-radius: 4px;
        }

        .slider-track {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            background: #334155;
            border-radius: 4px;
            outline: none;
        }

        .slider-track::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .slider-track::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border: none;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 50%;
            cursor: pointer;
        }

        @keyframes glow {

            0%,
            100% {
                box-shadow: 0 0 6px rgba(34, 197, 94, 0.5);
            }

            50% {
                box-shadow: 0 0 18px rgba(34, 197, 94, 0.9);
            }
        }

        .sync-badge {
            animation: glow 1.5s infinite;
        }

        .info-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-field {
            background: #1e293b;
            border: 1px solid #475569;
            color: white;
            padding: 6px 8px;
            border-radius: 6px;
            width: 84px;
            text-align: center;
            font-size: 1rem;
        }

        .input-field:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }

        .input-field.correct {
            border-color: #22c55e;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.35);
        }

        .thin-scroll {
            scrollbar-width: thin;
            scrollbar-color: #475569 transparent;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // ===== 単位系 =====
        // 1 ステップ = 1/60 s、1 m = 60（描画の基準座標）。
        // したがって速度 1 m/s = 1（座標/ステップ）で、画面の数値をそのまま m/s・J として扱える。
        const UNIT = 60;            // 1 m あたりの基準座標
        const DT = 1 / 60;          // 1 ステップの時間 [s]
        const SPRING_K = 0.03;      // ばね定数（基準座標系）。SI では 0.03 × 60² = 108 N/m
        const SPRING_REST = 160;    // ばねの自然長（基準座標）= 2.67 m
        const GRAPH_WINDOW = 4;     // グラフに表示する時間幅 [s]
        const SLOW_RATE = 0.5;      // スロー再生の倍率
        const radius = (m) => 15 + 5 * m;

        const COLORS = { A: '#f472b6', B: '#38bdf8', C: '#4ade80', G: '#facc15' };

        const MODES = [
            { id: 1, label: '1D衝突', desc: '一直線上の衝突' },
            { id: 2, label: '2D基本', desc: '斜め衝突' },
            { id: 3, label: '2D発展', desc: <>V<sub>G</sub> を計算</> },
            { id: 4, label: 'ばね系', desc: '衝突後の振動' }
        ];

        // 2D の衝突パターン（速度は x 右向き・y 上向きが正）
        const PATTERNS = {
            1: { v1: [3, 0], v2: [0, 0], desc: 'B は静止、A = (3, 0) m/s。A を上下にずらすと斜め衝突になる' },
            2: { v1: [3, -1], v2: [-3, 1], desc: 'すれ違うように：A = (3, −1)、B = (−3, 1) m/s' },
            3: { v1: [3, -1], v2: [-3, -1], desc: '両方下向き：A = (3, −1)、B = (−3, −1) m/s' },
            4: { v1: [4, 0.5], v2: [-2.5, 1.5], desc: '斜めに高速で：A = (4, 0.5)、B = (−2.5, 1.5) m/s' }
        };
        const PATTERN_POS = {
            1: (off) => [[-250, -60 + off], [50, -60]],
            2: () => [[-250, 0], [50, -60]],
            3: () => [[-250, -60], [50, -60]],
            4: () => [[-250, -30], [50, -50]]
        };

        const fmt = (v, d = 2) => (Math.abs(v) < 0.5 * 10 ** -d ? 0 : v).toFixed(d).replace('-', '−');
        const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

        // ===== 物理 =====

        // 2 円が初めて距離 R になる時刻（ステップ数）。当たらない場合は最接近の時刻
        function contactTime(pA, pB, vA, vB, R) {
            const dx = pB[0] - pA[0], dy = pB[1] - pA[1];
            const ux = vB[0] - vA[0], uy = vB[1] - vA[1];
            const a = ux * ux + uy * uy, b = 2 * (dx * ux + dy * uy), c = dx * dx + dy * dy - R * R;
            if (a === 0) return 0;
            const disc = b * b - 4 * a * c;
            if (disc < 0) return -b / (2 * a);
            return (-b - Math.sqrt(disc)) / (2 * a);
        }

        function maxOffset(m1, m2) {
            return radius(m1) + radius(m2) - 4;
        }

        function makeInitial(mode, P) {
            const base = { mode, t: 0, collisionTime: null, merged: false };
            if (mode === 1) {
                return {
                    ...base,
                    p1: { x: -250, y: 0, vx: P.v1, vy: 0, m: P.m1 },
                    p2: { x: 50, y: 0, vx: P.v2, vy: 0, m: P.m2 },
                    E0: 0.5 * P.m1 * P.v1 ** 2 + 0.5 * P.m2 * P.v2 ** 2
                };
            }
            if (mode === 2 || mode === 3) {
                const T = PATTERNS[P.pattern];
                const pos = PATTERN_POS[P.pattern](P.offset);
                const R = radius(P.m1) + radius(P.m2);
                const tc = Math.max(0, contactTime(pos[0], pos[1], T.v1, T.v2, R));
                const M = P.m1 + P.m2;
                // 衝突までの中間時刻に重心が画面中央に来るよう全体をずらす
                const gx = (P.m1 * pos[0][0] + P.m2 * pos[1][0]) / M + (P.m1 * T.v1[0] + P.m2 * T.v2[0]) / M * tc / 2;
                const gy = (P.m1 * pos[0][1] + P.m2 * pos[1][1]) / M + (P.m1 * T.v1[1] + P.m2 * T.v2[1]) / M * tc / 2;
                return {
                    ...base,
                    p1: { x: pos[0][0] - gx, y: pos[0][1] - gy, vx: T.v1[0], vy: T.v1[1], m: P.m1 },
                    p2: { x: pos[1][0] - gx, y: pos[1][1] - gy, vx: T.v2[0], vy: T.v2[1], m: P.m2 },
                    E0: 0.5 * P.m1 * (T.v1[0] ** 2 + T.v1[1] ** 2) + 0.5 * P.m2 * (T.v2[0] ** 2 + T.v2[1] ** 2)
                };
            }
            // ばね系：B と C は静止、ばねは自然長
            const xC = 80;
            const xB = xC - SPRING_REST;
            const xA = xB - 220;
            return {
                ...base,
                p1: { x: xA, y: 0, vx: P.v1, vy: 0, m: P.m1 },
                p2: { x: xB, y: 0, vx: 0, vy: 0, m: P.m2 },
                p3: { x: xC, y: 0, vx: 0, vy: 0, m: P.m3 },
                cmBC0: (P.m2 * xB + P.m3 * xC) / (P.m2 + P.m3),
                cameraAnchorX: null,
                E0: 0.5 * P.m1 * P.v1 ** 2
            };
        }

        function collide1D(a, b, e) {
            const va = a.vx, vb = b.vx, M = a.m + b.m;
            a.vx = ((a.m - e * b.m) * va + (1 + e) * b.m * vb) / M;
            b.vx = ((b.m - e * a.m) * vb + (1 + e) * a.m * va) / M;
        }

        // ばね系で「ばねにつながった物体」とみなす質量（e = 0 で A が合体したら A + B）
        const massB = (s) => (s.merged ? s.p1.m + s.p2.m : s.p2.m);

        // ばね系の重心（合体後は A も含める）
        function cmSpring(s) {
            if (s.merged) {
                const M = s.p1.m + s.p2.m + s.p3.m;
                return (s.p1.m * s.p1.x + s.p2.m * s.p2.x + s.p3.m * s.p3.x) / M;
            }
            return (s.p2.m * s.p2.x + s.p3.m * s.p3.x) / (s.p2.m + s.p3.m);
        }

        function step(s, mode, e) {
            s.t += DT;
            if (mode === 1) {
                const { p1, p2 } = s;
                p1.x += p1.vx;
                p2.x += p2.vx;
                if (p2.x - p1.x < radius(p1.m) + radius(p2.m) && p1.vx > p2.vx) {
                    collide1D(p1, p2, e);
                    if (s.collisionTime === null) s.collisionTime = s.t;
                }
                return;
            }
            if (mode === 2 || mode === 3) {
                const { p1, p2 } = s;
                p1.x += p1.vx; p1.y += p1.vy;
                p2.x += p2.vx; p2.y += p2.vy;
                const dx = p2.x - p1.x, dy = p2.y - p1.y;
                const dist = Math.hypot(dx, dy);
                if (dist > 0 && dist < radius(p1.m) + radius(p2.m)) {
                    const nx = dx / dist, ny = dy / dist;
                    const dvn = (p1.vx - p2.vx) * nx + (p1.vy - p2.vy) * ny;
                    if (dvn > 0) {
                        // 法線方向にだけ力積がはたらく（なめらかな球）
                        const j = ((1 + e) * dvn) / (1 / p1.m + 1 / p2.m);
                        p1.vx -= j * nx / p1.m; p1.vy -= j * ny / p1.m;
                        p2.vx += j * nx / p2.m; p2.vy += j * ny / p2.m;
                        if (s.collisionTime === null) s.collisionTime = s.t;
                    }
                }
                return;
            }
            // ばね系
            const { p1, p2, p3 } = s;
            const rAB = radius(p1.m) + radius(p2.m);
            if (!s.merged) {
                p1.x += p1.vx;
                // A と B の衝突（離れた後に再び追いついた場合も衝突させる）
                if (p2.x - p1.x < rAB && p1.vx > p2.vx) {
                    if (e === 0) {
                        const v = (p1.m * p1.vx + p2.m * p2.vx) / (p1.m + p2.m);
                        p1.vx = v; p2.vx = v;
                        p1.x = p2.x - rAB;
                        s.merged = true;
                    } else {
                        collide1D(p1, p2, e);
                    }
                    if (s.collisionTime === null) {
                        s.collisionTime = s.t;
                        s.cameraAnchorX = cmSpring(s);
                    }
                }
            }
            // ばねでつながった B・C の運動（シンプレクティック・オイラー法、サブステップ）
            const mB = massB(s);
            const n = 10, h = 1 / n;
            for (let i = 0; i < n; i++) {
                const F = SPRING_K * ((p3.x - p2.x) - SPRING_REST); // 伸びていれば B を +x、C を −x に引く
                p2.vx += (F / mB) * h;
                p3.vx -= (F / p3.m) * h;
                p2.x += p2.vx * h;
                p3.x += p3.vx * h;
            }
            if (s.merged) {
                p1.x = p2.x - rAB;
                p1.vx = p2.vx;
            }
        }

        // 重心速度 V_G（ばね系は B・C、衝突前は衝突後の値の予測）
        function vgOf(mode, P, s) {
            if (mode === 1) return { x: (P.m1 * P.v1 + P.m2 * P.v2) / (P.m1 + P.m2), y: 0 };
            if (mode === 2 || mode === 3) {
                const T = PATTERNS[P.pattern];
                const M = P.m1 + P.m2;
                return { x: (P.m1 * T.v1[0] + P.m2 * T.v2[0]) / M, y: (P.m1 * T.v1[1] + P.m2 * T.v2[1]) / M };
            }
            if (s && s.collisionTime !== null) {
                const mB = massB(s);
                return { x: (mB * s.p2.vx + s.p3.m * s.p3.vx) / (mB + s.p3.m), y: 0 };
            }
            return { x: predictedVgSpring(P), y: 0 };
        }

        function predictedVgSpring(P) {
            if (P.e === 0) return (P.m1 * P.v1) / (P.m1 + P.m2 + P.m3);
            const vB = ((1 + P.e) * P.m1 * P.v1) / (P.m1 + P.m2);
            return (P.m2 * vB) / (P.m2 + P.m3);
        }

        function cameraVOf(mode, cam, vg) {
            if (mode === 2) {
                const mag = Math.hypot(vg.x, vg.y);
                if (mag === 0) return { x: 0, y: 0 };
                return { x: (vg.x / mag) * cam.mag, y: (vg.y / mag) * cam.mag };
            }
            if (mode === 3) return { x: cam.vx, y: cam.vy };
            return { x: cam.vx, y: 0 };
        }

        // 実際にカメラが動いている速度（ばね系は衝突までカメラ静止）
        function effectiveCamV(mode, s, camV) {
            if (mode === 4 && s.collisionTime === null) return { x: 0, y: 0 };
            return camV;
        }

        function cameraPos(mode, s, camV) {
            if (mode === 4) {
                if (s.collisionTime === null) return { x: s.cmBC0, y: 0 };
                return { x: s.cameraAnchorX + camV.x * (s.t - s.collisionTime) / DT, y: 0 };
            }
            return { x: camV.x * s.t / DT, y: camV.y * s.t / DT };
        }

        // 床から見たエネルギー [J]
        function energiesOf(mode, s) {
            let bodies, U = 0;
            if (mode === 4) {
                bodies = [{ m: massB(s), vx: s.p2.vx, vy: 0 }, { m: s.p3.m, vx: s.p3.vx, vy: 0 }];
                U = 0.5 * SPRING_K * ((s.p3.x - s.p2.x) - SPRING_REST) ** 2;
            } else {
                bodies = [s.p1, s.p2];
            }
            const M = bodies.reduce((a, b) => a + b.m, 0);
            const Vx = bodies.reduce((a, b) => a + b.m * b.vx, 0) / M;
            const Vy = bodies.reduce((a, b) => a + b.m * b.vy, 0) / M;
            const K = bodies.reduce((a, b) => a + 0.5 * b.m * (b.vx ** 2 + b.vy ** 2), 0);
            const KG = 0.5 * M * (Vx ** 2 + Vy ** 2);
            const Krel = bodies.reduce((a, b) => a + 0.5 * b.m * ((b.vx - Vx) ** 2 + (b.vy - Vy) ** 2), 0);
            return { K, KG, Krel, U };
        }

        // グラフ用の記録（カメラから見た値）
        function sampleOf(mode, s, camV) {
            const cv = effectiveCamV(mode, s, camV);
            const cp = cameraPos(mode, s, camV);
            if (mode === 1) {
                const M = s.p1.m + s.p2.m;
                const xG = (s.p1.m * s.p1.x + s.p2.m * s.p2.x) / M;
                const vG = (s.p1.m * s.p1.vx + s.p2.m * s.p2.vx) / M;
                return {
                    t: s.t,
                    x1: (s.p1.x - cp.x) / UNIT, x2: (s.p2.x - cp.x) / UNIT, xG: (xG - cp.x) / UNIT,
                    v1: s.p1.vx - cv.x, v2: s.p2.vx - cv.x, vG: vG - cv.x
                };
            }
            const mB = massB(s), M = mB + s.p3.m;
            const xG = cmSpring(s);
            const vG = (mB * s.p2.vx + s.p3.m * s.p3.vx) / M;
            return {
                t: s.t,
                x1: (s.p2.x - cp.x) / UNIT, x2: (s.p3.x - cp.x) / UNIT, xG: (xG - cp.x) / UNIT,
                v1: s.p2.vx - cv.x, v2: s.p3.vx - cv.x, vG: vG - cv.x
            };
        }

        // ===== 描画 =====

        // CSS サイズに合わせて高解像度化し、CSS ピクセル単位の ctx を返す
        function fitCanvas(canvas) {
            if (!canvas) return null;
            const w = canvas.clientWidth, h = canvas.clientHeight;
            if (!w || !h) return null;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const W = Math.round(w * dpr), H = Math.round(h * dpr);
            if (canvas.width !== W || canvas.height !== H) {
                canvas.width = W;
                canvas.height = H;
            }
            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            return { ctx, w, h };
        }

        function arrow(ctx, x0, y0, x1, y1, color, width = 2, dashed = false) {
            const len = Math.hypot(x1 - x0, y1 - y0);
            if (len < 2) return;
            ctx.save();
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = width;
            if (dashed) ctx.setLineDash([5, 4]);
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.stroke();
            ctx.setLineDash([]);
            const a = Math.atan2(y1 - y0, x1 - x0);
            const hl = Math.min(9, len * 0.5);
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x1 - hl * Math.cos(a - 0.4), y1 - hl * Math.sin(a - 0.4));
            ctx.lineTo(x1 - hl * Math.cos(a + 0.4), y1 - hl * Math.sin(a + 0.4));
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawStage(canvas, s, L, traces) {
            const fit = fitCanvas(canvas);
            if (!fit || !s) return;
            const { ctx, w, h } = fit;
            const { mode } = L;
            const is2D = mode === 2 || mode === 3;
            // 画面の大きさに合わせて縮尺を決める（スマホでも全体が入るように）
            const S = clamp(Math.min(w / 760, h / (is2D ? 330 : 170)), 0.35, 1.7);
            const cam = cameraPos(mode, s, L.camV);
            const cv = effectiveCamV(mode, s, L.camV);
            const cx = w / 2, cy = h / 2;
            const X = (x) => cx + (x - cam.x) * S;
            const Y = (y) => cy - (y - cam.y) * S; // y は上向きが正

            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, w, h);

            // 方眼（1 マス = 1 m）
            const g = UNIT * S;
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.14)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = ((X(0) % g) + g) % g; x < w; x += g) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
            for (let y = ((Y(0) % g) + g) % g; y < h; y += g) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
            ctx.stroke();

            // 軌跡（カメラから見た経路）
            if (is2D) {
                const drawTrace = (tr, color) => {
                    if (tr.length < 2) return;
                    ctx.beginPath();
                    tr.forEach((p, i) => {
                        const x = cx + p.x * S, y = cy - p.y * S;
                        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    });
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                };
                drawTrace(traces.p1, 'rgba(244, 114, 182, 0.55)');
                drawTrace(traces.p2, 'rgba(56, 189, 248, 0.55)');
            }

            // ばね
            if (mode === 4) {
                const x1 = X(s.p2.x) + radius(s.p2.m) * S;
                const x2 = X(s.p3.x) - radius(s.p3.m) * S;
                const y = Y(0);
                const coils = 12, amp = 9 * Math.max(S, 0.6);
                ctx.beginPath();
                ctx.moveTo(x1, y);
                for (let i = 1; i < coils; i++) {
                    const xx = x1 + (x2 - x1) * (i / coils);
                    ctx.lineTo(xx, y + (i % 2 ? -amp : amp));
                }
                ctx.lineTo(x2, y);
                ctx.strokeStyle = '#a78bfa';
                ctx.lineWidth = 2.5;
                ctx.stroke();
            }

            const bodies = [[s.p1, COLORS.A, 'A']];
            bodies.push([s.p2, COLORS.B, 'B']);
            if (s.p3) bodies.push([s.p3, COLORS.C, 'C']);

            // 物体
            for (const [p, color, label] of bodies) {
                const px = X(p.x), py = Y(p.y), r = radius(p.m) * S;
                const grad = ctx.createRadialGradient(px, py, 0, px, py, r);
                grad.addColorStop(0, color);
                grad.addColorStop(1, color + '4d');
                ctx.beginPath();
                ctx.arc(px, py, r, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 13px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(label, px, py);
            }

            // 重心 G
            let gx, gy;
            if (mode === 4) {
                gx = s.collisionTime === null && !s.merged ? (s.p2.m * s.p2.x + s.p3.m * s.p3.x) / (s.p2.m + s.p3.m) : cmSpring(s);
                gy = 0;
            } else {
                const M = s.p1.m + s.p2.m;
                gx = (s.p1.m * s.p1.x + s.p2.m * s.p2.x) / M;
                gy = (s.p1.m * s.p1.y + s.p2.m * s.p2.y) / M;
            }
            const gpx = X(gx), gpy = Y(gy);

            // 重心からの距離
            if (L.showDist) {
                const targets = mode === 4 ? bodies.slice(1) : bodies;
                for (const [p, color] of targets) {
                    const px = X(p.x), py = Y(p.y);
                    ctx.save();
                    ctx.setLineDash([3, 4]);
                    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(gpx, gpy);
                    ctx.lineTo(px, py);
                    ctx.stroke();
                    ctx.restore();
                    const d = Math.hypot(p.x - gx, p.y - gy) / UNIT;
                    ctx.fillStyle = color;
                    ctx.font = '12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText(`${d.toFixed(2)} m`, (gpx + px) / 2, (gpy + py) / 2 - 22);
                }
            }

            // 速度ベクトル（カメラから見た速度）
            const VS = 10 * S;
            for (const [p] of bodies) {
                const vx = p.vx - cv.x, vy = p.vy - cv.y;
                if (Math.hypot(vx, vy) > 0.05) {
                    arrow(ctx, X(p.x), Y(p.y), X(p.x) + vx * VS, Y(p.y) - vy * VS, '#fbbf24', 2);
                }
            }

            // 重心マーカー
            ctx.strokeStyle = COLORS.G;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(gpx - 11, gpy); ctx.lineTo(gpx + 11, gpy);
            ctx.moveTo(gpx, gpy - 11); ctx.lineTo(gpx, gpy + 11);
            ctx.stroke();
            ctx.font = 'bold 13px sans-serif';
            ctx.fillStyle = COLORS.G;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            ctx.fillText('G', gpx + 8, gpy - 6);

            // 2D：重心 G の速度（カメラから見た）を破線で
            if (is2D) {
                const ux = L.vg.x - cv.x, uy = L.vg.y - cv.y;
                if (Math.hypot(ux, uy) > 0.05) {
                    const VG_S = 15 * S;
                    arrow(ctx, gpx, gpy, gpx + ux * VG_S, gpy - uy * VG_S, 'rgba(250, 204, 21, 0.8)', 2, true);
                }
            }

            // 縮尺
            ctx.font = '12px sans-serif';
            ctx.fillStyle = 'rgba(203, 213, 225, 0.8)';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            ctx.fillText('1 マス = 1 m', 8, h - 6);
        }

        function niceStep(range, target) {
            if (!(range > 0)) return 1;
            const raw = range / target;
            const p = 10 ** Math.floor(Math.log10(raw));
            const f = raw / p;
            return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
        }

        function drawGraph(canvas, hist, cfg, view, drag, geomRef) {
            const fit = fitCanvas(canvas);
            if (!fit) return;
            const { ctx, w, h } = fit;
            const Lm = 48, Rm = 10, Tm = 10, Bm = 26;
            const pw = w - Lm - Rm, ph = h - Tm - Bm, midY = Tm + ph / 2;
            geomRef.current = { L: Lm, T: Tm, pw, ph, midY };

            ctx.fillStyle = '#0b1222';
            ctx.fillRect(0, 0, w, h);

            const t0 = Math.max(0, cfg.tNow - GRAPH_WINDOW);
            let yMax = cfg.minY;
            for (const hh of hist) for (const se of cfg.series) yMax = Math.max(yMax, Math.abs(hh[se.key]));
            yMax *= 1.12;

            const tx = (t) => Lm + ((t - t0) / GRAPH_WINDOW) * pw * view.sx + view.ox;
            const vy = (v) => midY - (v / yMax) * (ph / 2) * view.sy + view.oy;
            const tAt = (px) => t0 + ((px - Lm - view.ox) / view.sx / pw) * GRAPH_WINDOW;
            const vAt = (py) => ((midY + view.oy - py) / ((ph / 2) * view.sy)) * yMax;

            ctx.save();
            ctx.beginPath();
            ctx.rect(Lm, Tm, pw, ph);
            ctx.clip();

            // 目盛り線
            ctx.font = '11px sans-serif';
            const tA = tAt(Lm), tB = tAt(Lm + pw);
            const ts = niceStep(tB - tA, Math.max(3, Math.floor(pw / 90)));
            const vTop = vAt(Tm), vBot = vAt(Tm + ph);
            const vs = niceStep(vTop - vBot, Math.max(3, Math.floor(ph / 40)));
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.13)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let t = Math.ceil(tA / ts) * ts; t <= tB; t += ts) { const x = tx(t); ctx.moveTo(x, Tm); ctx.lineTo(x, Tm + ph); }
            for (let v = Math.ceil(vBot / vs) * vs; v <= vTop; v += vs) { const y = vy(v); ctx.moveTo(Lm, y); ctx.lineTo(Lm + pw, y); }
            ctx.stroke();
            // 0 の線
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.45)';
            ctx.beginPath();
            ctx.moveTo(Lm, vy(0));
            ctx.lineTo(Lm + pw, vy(0));
            ctx.stroke();

            // データ
            for (const se of cfg.series) {
                if (!hist.length) break;
                ctx.beginPath();
                hist.forEach((hh, i) => {
                    const x = tx(hh.t), y = vy(hh[se.key]);
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                });
                ctx.strokeStyle = se.color;
                ctx.lineWidth = 2;
                ctx.setLineDash(se.dashed ? [6, 4] : []);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // 範囲ズームの選択枠
            if (drag.active && drag.mode === 'zoom') {
                const rx = Math.min(drag.sx, drag.cx), ry = Math.min(drag.sy, drag.cy);
                ctx.fillStyle = 'rgba(56, 189, 248, 0.2)';
                ctx.strokeStyle = 'rgba(56, 189, 248, 0.8)';
                ctx.fillRect(rx, ry, Math.abs(drag.cx - drag.sx), Math.abs(drag.cy - drag.sy));
                ctx.strokeRect(rx, ry, Math.abs(drag.cx - drag.sx), Math.abs(drag.cy - drag.sy));
            }
            ctx.restore();

            // 枠と目盛りの数値
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
            ctx.strokeRect(Lm + 0.5, Tm + 0.5, pw, ph);
            ctx.fillStyle = '#94a3b8';
            ctx.font = '11px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            const td = ts < 1 ? 1 : 0;
            for (let t = Math.ceil(tA / ts) * ts; t <= tB + 1e-9; t += ts) {
                const x = tx(t);
                if (x >= Lm - 1 && x <= Lm + pw + 1) ctx.fillText(fmt(t, td), x, Tm + ph + 4);
            }
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            const vd = vs < 0.1 ? 2 : vs < 1 ? 1 : 0;
            for (let v = Math.ceil(vBot / vs) * vs; v <= vTop + 1e-9; v += vs) {
                const y = vy(v);
                if (y >= Tm - 1 && y <= Tm + ph + 1) ctx.fillText(fmt(v, vd), Lm - 5, y);
            }
            // 軸の名前
            ctx.fillStyle = '#cbd5e1';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(cfg.yLabel, Lm + 6, Tm + 4);
            ctx.textAlign = 'right';
            ctx.textBaseline = 'bottom';
            ctx.fillText('t [s]', Lm + pw - 4, Tm + ph - 3);
            // 凡例
            ctx.textAlign = 'right';
            ctx.textBaseline = 'top';
            let lx = Lm + pw - 6;
            for (const se of [...cfg.series].reverse()) {
                ctx.fillStyle = se.color;
                ctx.font = 'bold 12px sans-serif';
                ctx.fillText(se.label, lx, Tm + 4);
                lx -= ctx.measureText(se.label).width + 12;
            }
        }

        // ===== 部品 =====

        const ToggleGroup = ({ label, options, value, onChange, format }) => (
            <div>
                <div className="text-xs text-slate-400 mb-1">{label}</div>
                <div className="flex gap-1 flex-wrap">
                    {options.map(opt => (
                        <button
                            key={opt}
                            onClick={() => onChange(opt)}
                            className={`toggle-btn min-w-[2.25rem] px-2 py-1 rounded text-sm font-medium ${value === opt ? 'active text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}
                        >
                            {format ? format(opt) : String(opt).replace('-', '−')}
                        </button>
                    ))}
                </div>
            </div>
        );

        // スナップ付きスライダー（目盛りの近くで吸着）
        const SnapSlider = ({ value, onChange, snapPoints, min, max }) => {
            const handleChange = (e) => {
                let v = parseFloat(e.target.value);
                for (const sp of snapPoints) {
                    if (Math.abs(v - sp.value) < (max - min) * 0.035) { v = sp.value; break; }
                }
                onChange(v);
            };
            // ラベルが近いときは上下 2 段に分ける
            let lastPos = -100, row = 0;
            const marks = [...snapPoints].sort((a, b) => a.value - b.value).map(sp => {
                const pos = ((sp.value - min) / (max - min)) * 100;
                row = pos - lastPos < 11 ? 1 - row : 0;
                lastPos = pos;
                return { ...sp, pos, row };
            });
            return (
                <div className="relative pt-9">
                    <div className="absolute inset-x-0 top-0 h-9">
                        {marks.map((sp, i) => (sp.pos < 0 || sp.pos > 100) ? null : (
                            <React.Fragment key={i}>
                                <div className="snap-label" style={{ left: `${sp.pos}%`, top: sp.row ? 0 : 13 }}>{sp.label}</div>
                                <div className="snap-point" style={{ left: `${sp.pos}%`, top: 26 }} />
                            </React.Fragment>
                        ))}
                    </div>
                    <input type="range" min={min} max={max} step={0.1} value={value} onChange={handleChange} className="slider-track" />
                </div>
            );
        };

        const EnergyBar = ({ label, sub, value, maxValue, color }) => (
            <div>
                <div className="flex justify-between items-baseline text-xs text-slate-300 mb-0.5">
                    <span>{label}{sub && <span className="text-slate-500 ml-1">{sub}</span>}</span>
                    <span className="tabular-nums">{fmt(value, 1)} J</span>
                </div>
                <div className="h-2 bg-slate-700 rounded overflow-hidden">
                    <div className="energy-bar" style={{ width: `${clamp((value / maxValue) * 100, 0, 100)}%`, background: color }} />
                </div>
            </div>
        );

        const Section = ({ title, children, right }) => (
            <section className="space-y-2">
                <div className="flex items-center justify-between">
                    <h2 className="font-bold text-slate-200 text-sm">{title}</h2>
                    {right}
                </div>
                {children}
            </section>
        );

        const SyncBadge = () => (
            <div className="sync-badge inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-green-500/25 border border-green-500 text-green-300 text-xs font-bold">
                <span className="w-2 h-2 bg-green-400 rounded-full"></span>
                重心系で観察中
            </div>
        );

        function useLayoutMode() {
            const get = () => {
                const w = window.innerWidth, h = window.innerHeight;
                return (w >= 900 && h >= 500) || (w >= 640 && w > h * 1.2) ? 'wide' : 'compact';
            };
            const [mode, setMode] = useState(get);
            useEffect(() => {
                const on = () => setMode(get());
                window.addEventListener('resize', on);
                return () => window.removeEventListener('resize', on);
            }, []);
            return mode;
        }

        const emptyView = () => ({ sx: 1, sy: 1, ox: 0, oy: 0 });

        // ===== アプリ本体 =====
        const App = () => {
            const layout = useLayoutMode();
            const [mode, setMode] = useState(1);
            const [m1, setM1] = useState(2);
            const [m2, setM2] = useState(1);
            const [m3, setM3] = useState(1);
            const [v1, setV1] = useState(4);
            const [v2, setV2] = useState(0);
            const [restitution, setRestitution] = useState(1.0);
            const [pattern, setPattern] = useState(1);
            const [offset, setOffset] = useState(20);

            const [camVx, setCamVx] = useState(0);      // 1D・ばね系
            const [camMag, setCamMag] = useState(0);    // 2D基本（向きは V_G に固定）
            const [inVx, setInVx] = useState('0');      // 2D発展（入力欄の文字列）
            const [inVy, setInVy] = useState('0');
            const [revealVg, setRevealVg] = useState(false);

            const [playing, setPlaying] = useState(false);
            const [slowMo, setSlowMo] = useState(false);
            const [showDist, setShowDist] = useState(false);
            const [plotKind, setPlotKind] = useState('v'); // 'x' or 'v'
            const [showGPlot, setShowGPlot] = useState(false);
            const [zoomArm, setZoomArm] = useState(false);
            const [showInfo, setShowInfo] = useState(false);
            const [, setTick] = useState(0);

            const stageRef = useRef(null);
            const graphRef = useRef(null);
            const stageBoxRef = useRef(null);
            const graphBoxRef = useRef(null);
            const stateRef = useRef(null);
            const histRef = useRef([]);
            const traceRef = useRef({ p1: [], p2: [] });
            const viewRef = useRef(emptyView());
            const viewHistRef = useRef([]);
            const dragRef = useRef({ active: false });
            const geomRef = useRef(null);
            const liveRef = useRef(null);
            const drawRef = useRef(() => { });

            const offMax = maxOffset(m1, m2);
            const offsetC = clamp(offset, -offMax, offMax);
            const P = { m1, m2, m3, v1, v2, e: restitution, pattern, offset: offsetC };
            const cam = { vx: mode === 3 ? (parseFloat(inVx) || 0) : camVx, vy: parseFloat(inVy) || 0, mag: camMag };

            // モード切替直後（初期化前）の古い状態は使わない
            const s = stateRef.current && stateRef.current.mode === mode ? stateRef.current : null;
            const vg = vgOf(mode, P, s);
            const camV = cameraVOf(mode, cam, vg);
            const synced = Math.abs(vg.x - camV.x) < 0.15 && Math.abs(vg.y - camV.y) < 0.15;
            const en = s ? energiesOf(mode, s) : { K: 0, KG: 0, Krel: 0, U: 0 };
            const E0 = Math.max(1, s?.E0 || 0);

            liveRef.current = { mode, P, cam, showDist, plotKind, showGPlot, slowMo };

            // 初期化（条件が変わったら最初から）
            const resetSim = () => {
                stateRef.current = makeInitial(mode, P);
                histRef.current = [];
                traceRef.current = { p1: [], p2: [] };
                setTick(t => t + 1);
            };
            useEffect(resetSim, [mode, m1, m2, m3, v1, v2, pattern, offsetC]);

            useEffect(() => { setRevealVg(false); }, [mode, m1, m2, pattern]);

            const changeMode = (id) => {
                setPlaying(false);
                setMode(id);
                setCamVx(0); setCamMag(0); setInVx('0'); setInVy('0');
                setPlotKind(id === 4 ? 'x' : 'v');
                viewRef.current = emptyView();
                viewHistRef.current = [];
            };

            // 1 ステップ進めて記録する
            const advance = () => {
                const st = stateRef.current;
                const lv = liveRef.current;
                if (!st || st.mode !== lv.mode) return;
                step(st, lv.mode, lv.P.e);
                const v = vgOf(lv.mode, lv.P, st);
                const cv = cameraVOf(lv.mode, lv.cam, v);
                if (lv.mode === 1 || lv.mode === 4) {
                    histRef.current.push(sampleOf(lv.mode, st, cv));
                    const tMin = st.t - GRAPH_WINDOW - 0.2;
                    while (histRef.current.length && histRef.current[0].t < tMin) histRef.current.shift();
                } else {
                    const cp = cameraPos(lv.mode, st, cv);
                    const tr = traceRef.current;
                    tr.p1.push({ x: st.p1.x - cp.x, y: st.p1.y - cp.y });
                    tr.p2.push({ x: st.p2.x - cp.x, y: st.p2.y - cp.y });
                    if (tr.p1.length > 400) { tr.p1.shift(); tr.p2.shift(); }
                }
            };

            // 描画（最新の値は liveRef から読む）
            drawRef.current = () => {
                const st = stateRef.current;
                const lv = liveRef.current;
                if (!st || st.mode !== lv.mode) return;
                const v = vgOf(lv.mode, lv.P, st);
                const cv = cameraVOf(lv.mode, lv.cam, v);
                drawStage(stageRef.current, st, { mode: lv.mode, camV: cv, vg: v, showDist: lv.showDist }, traceRef.current);
                if ((lv.mode === 1 || lv.mode === 4) && graphRef.current) {
                    const names = lv.mode === 1 ? ['A', 'B'] : ['B', 'C'];
                    const k = lv.plotKind;
                    const series = [
                        { key: k + '1', color: COLORS[names[0]], label: names[0] },
                        { key: k + '2', color: COLORS[names[1]], label: names[1] }
                    ];
                    if (lv.showGPlot) series.push({ key: k + 'G', color: COLORS.G, label: 'G', dashed: true });
                    drawGraph(graphRef.current, histRef.current, {
                        series,
                        yLabel: k === 'x' ? 'x [m]' : 'v [m/s]',
                        minY: 1,
                        tNow: st.t
                    }, viewRef.current, dragRef.current, geomRef);
                }
            };

            // アニメーション（実時間に合わせて固定刻みで進める）
            useEffect(() => {
                if (!playing) return;
                let raf, last = null, acc = 0;
                const loop = (ts) => {
                    if (last === null) last = ts;
                    const real = Math.min(0.1, (ts - last) / 1000);
                    last = ts;
                    acc += real * (liveRef.current.slowMo ? SLOW_RATE : 1);
                    let n = 0;
                    while (acc >= DT && n < 12) { advance(); acc -= DT; n++; }
                    drawRef.current();
                    setTick(t => t + 1);
                    raf = requestAnimationFrame(loop);
                };
                raf = requestAnimationFrame(loop);
                return () => cancelAnimationFrame(raf);
            }, [playing]);

            // 停止中も、表示に関わる変更のたびに描き直す
            useEffect(() => { drawRef.current(); });

            // 大きさが変わったら描き直す
            useEffect(() => {
                const ro = new ResizeObserver(() => drawRef.current());
                if (stageBoxRef.current) ro.observe(stageBoxRef.current);
                if (graphBoxRef.current) ro.observe(graphBoxRef.current);
                return () => ro.disconnect();
            }, [mode, layout]);

            // ===== グラフ操作（ドラッグで移動、Shift+ドラッグ または「範囲ズーム」で拡大）=====
            const localXY = (e) => {
                const r = graphRef.current.getBoundingClientRect();
                return [e.clientX - r.left, e.clientY - r.top];
            };
            const onGraphDown = (e) => {
                const [x, y] = localXY(e);
                dragRef.current = {
                    active: true, mode: (e.shiftKey || zoomArm) ? 'zoom' : 'pan',
                    sx: x, sy: y, cx: x, cy: y, ox0: viewRef.current.ox, oy0: viewRef.current.oy
                };
                graphRef.current.setPointerCapture(e.pointerId);
            };
            const onGraphMove = (e) => {
                const d = dragRef.current;
                if (!d.active) return;
                const [x, y] = localXY(e);
                d.cx = x; d.cy = y;
                if (d.mode === 'pan') {
                    viewRef.current = { ...viewRef.current, ox: d.ox0 + (x - d.sx), oy: d.oy0 + (y - d.sy) };
                }
                drawRef.current();
            };
            const onGraphUp = (e) => {
                const d = dragRef.current;
                if (!d.active) return;
                d.active = false;
                if (d.mode === 'zoom') {
                    const g = geomRef.current;
                    const x1 = Math.min(d.sx, d.cx), x2 = Math.max(d.sx, d.cx);
                    const y1 = Math.min(d.sy, d.cy), y2 = Math.max(d.sy, d.cy);
                    if (g && x2 - x1 > 10 && y2 - y1 > 10) {
                        const v = viewRef.current;
                        viewHistRef.current.push(v);
                        const bx1 = (x1 - g.L - v.ox) / v.sx, bx2 = (x2 - g.L - v.ox) / v.sx;
                        const by1 = (g.midY + v.oy - y1) / v.sy, by2 = (g.midY + v.oy - y2) / v.sy;
                        const sx = g.pw / (bx2 - bx1), sy = g.ph / (by1 - by2);
                        viewRef.current = { sx, sy, ox: -bx1 * sx, oy: g.T - g.midY + by1 * sy };
                    }
                    setZoomArm(false);
                } else if (Math.abs(d.cx - d.sx) + Math.abs(d.cy - d.sy) > 3) {
                    viewHistRef.current.push({ ...viewRef.current, ox: d.ox0, oy: d.oy0 });
                }
                if (viewHistRef.current.length > 30) viewHistRef.current.shift();
                try { graphRef.current.releasePointerCapture(e.pointerId); } catch (err) { }
                drawRef.current();
            };
            const undoView = () => {
                if (viewHistRef.current.length) viewRef.current = viewHistRef.current.pop();
                drawRef.current();
            };
            const resetView = () => {
                viewHistRef.current = [];
                viewRef.current = emptyView();
                drawRef.current();
            };

            // ===== 表示用の値 =====
            const tNow = s?.t || 0;
            const is2D = mode === 2 || mode === 3;
            const hasGraph = mode === 1 || mode === 4;
            const camText = mode === 2
                ? `|V| = ${fmt(camMag, 1)} m/s`
                : mode === 3 ? `V = (${fmt(cam.vx, 1)}, ${fmt(cam.vy, 1)}) m/s` : `V = ${fmt(camVx, 1)} m/s`;

            const snap1D = useMemo(() => {
                const pts = [{ value: 0, label: '0' }];
                if (Math.abs(vg.x) > 0.05) pts.push({ value: vg.x, label: <>V<sub>G</sub></> });
                if (v1 !== 0 && Math.abs(v1 - vg.x) > 0.05) pts.push({ value: v1, label: 'v₁' });
                if (v2 !== 0 && Math.abs(v2 - vg.x) > 0.05) pts.push({ value: v2, label: 'v₂' });
                return pts;
            }, [vg.x, v1, v2]);

            const vgMag = Math.hypot(vg.x, vg.y);
            const vgSpring = mode === 4 ? vg.x : 0;

            // ===== 画面部品 =====
            const header = (
                <header className={layout === 'wide' ? 'flex items-center gap-3 px-3 py-2' : 'px-3 pt-2 pb-1 space-y-2'}>
                    <div className="flex items-center justify-between gap-2 shrink-0">
                        <h1 className="text-lg font-bold bg-gradient-to-r from-pink-400 via-purple-400 to-blue-400 bg-clip-text text-transparent whitespace-nowrap">
                            重心系・相対運動ビジュアライザー
                        </h1>
                        {layout !== 'wide' && infoButton()}
                    </div>
                    <nav className={layout === 'wide' ? 'flex gap-1.5' : 'grid grid-cols-4 gap-1.5'}>
                        {MODES.map(m => (
                            <button
                                key={m.id}
                                onClick={() => changeMode(m.id)}
                                className={`px-3 py-1 rounded-lg transition text-center ${mode === m.id ? 'bg-gradient-to-r from-blue-500 to-purple-500 text-white' : 'glass text-slate-300 hover:bg-slate-600'}`}
                            >
                                <div className="font-bold text-sm leading-tight">{m.label}</div>
                                <div className="text-[11px] opacity-80 leading-tight whitespace-nowrap">{m.desc}</div>
                            </button>
                        ))}
                    </nav>
                    {layout === 'wide' && <div className="ml-auto">{infoButton()}</div>}
                </header>
            );

            function infoButton() {
                return (
                    <button onClick={() => setShowInfo(true)} className="flex items-center gap-1 px-3 py-1.5 rounded-full bg-slate-700 hover:bg-slate-600 transition text-sm" title="使い方">
                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        {layout === 'wide' && '使い方'}
                    </button>
                );
            }

            const stage = (
                <div ref={stageBoxRef} className="relative w-full h-full">
                    <canvas ref={stageRef} className="absolute inset-0 w-full h-full" />
                    <div className="absolute top-2 left-2 flex flex-col items-start gap-1 pointer-events-none">
                        <div className="px-2 py-0.5 rounded bg-slate-900/70 text-xs text-slate-200 tabular-nums">t = {fmt(tNow, 2)} s</div>
                        {synced && <SyncBadge />}
                    </div>
                    <div className="absolute top-2 right-2 px-2 py-0.5 rounded bg-slate-900/70 text-xs text-slate-200 pointer-events-none">
                        カメラ {camText}
                        {mode === 4 && s && s.collisionTime === null && <span className="text-slate-400">（衝突後に動く）</span>}
                    </div>
                </div>
            );

            const btn = `${layout === 'wide' ? 'px-3 text-sm' : 'px-2 text-xs'} py-1.5 rounded-lg transition font-medium whitespace-nowrap`;
            const actionBar = (
                <div className="flex items-center gap-2 px-2 py-2 border-t border-slate-700">
                    <button onClick={() => setPlaying(!playing)} className={`${btn} flex-1 max-w-[12rem] font-bold bg-gradient-to-r from-green-500 to-emerald-500 hover:from-green-400 hover:to-emerald-400`}>
                        {playing ? '⏸ 停止' : '▶ 再生'}
                    </button>
                    <button onClick={() => { setPlaying(false); resetSim(); }} className={`${btn} bg-slate-600 hover:bg-slate-500`}>↺ 最初から</button>
                    <button onClick={() => setSlowMo(!slowMo)} className={`${btn} ${slowMo ? 'bg-amber-500 text-slate-900' : 'bg-slate-600 hover:bg-slate-500'}`}>スロー</button>
                    <button onClick={() => setShowDist(!showDist)} className={`${btn} ${showDist ? 'bg-blue-500' : 'bg-slate-600 hover:bg-slate-500'}`} title="重心 G から各物体までの距離を表示">{layout === 'wide' ? 'G からの距離' : '距離'}</button>
                </div>
            );

            const graphPanel = hasGraph && (
                <div className="flex flex-col h-full min-h-0">
                    <div className="flex flex-wrap items-center gap-x-3 gap-y-1 px-2 pt-2 pb-1 text-xs text-slate-300">
                        <div className="flex rounded-md overflow-hidden border border-slate-600">
                            {[['x', 'x-t グラフ'], ['v', 'v-t グラフ']].map(([k, lab]) => (
                                <button key={k} onClick={() => setPlotKind(k)} className={`px-2 py-1 ${plotKind === k ? 'bg-blue-500 text-white' : 'bg-slate-700 hover:bg-slate-600'}`}>{lab}</button>
                            ))}
                        </div>
                        <label className="flex items-center gap-1">
                            <input type="checkbox" checked={showGPlot} onChange={(e) => setShowGPlot(e.target.checked)} />
                            重心 G も表示
                        </label>
                        <span className="text-slate-500">カメラから見た値</span>
                        <div className="flex gap-1 ml-auto">
                            <button onClick={() => setZoomArm(!zoomArm)} className={`px-2 py-1 rounded ${zoomArm ? 'bg-sky-500 text-white' : 'bg-slate-700 hover:bg-slate-600'}`} title="グラフ上をドラッグした範囲を拡大（Shift+ドラッグでも可）">範囲ズーム</button>
                            <button onClick={undoView} className="px-2 py-1 rounded bg-slate-700 hover:bg-slate-600">1つ戻す</button>
                            <button onClick={resetView} className="px-2 py-1 rounded bg-slate-700 hover:bg-slate-600">全体表示</button>
                        </div>
                    </div>
                    <div ref={graphBoxRef} className="relative flex-1 min-h-0 mx-2 mb-2 rounded overflow-hidden">
                        <canvas
                            ref={graphRef}
                            className={`absolute inset-0 w-full h-full ${zoomArm ? 'cursor-crosshair' : 'cursor-grab'}`}
                            onPointerDown={onGraphDown}
                            onPointerMove={onGraphMove}
                            onPointerUp={onGraphUp}
                            onPointerCancel={onGraphUp}
                            onDoubleClick={resetView}
                        />
                    </div>
                </div>
            );

            const params = (
                <Section title="条件">
                    <div className="grid grid-cols-2 gap-x-3 gap-y-2">
                        <ToggleGroup label="A の質量 m₁ (kg)" options={[1, 2, 3]} value={m1} onChange={setM1} />
                        <ToggleGroup label="B の質量 m₂ (kg)" options={[1, 2, 3]} value={m2} onChange={setM2} />
                        {(mode === 1 || mode === 4) && (
                            <ToggleGroup label="A の初速度 v₁ (m/s)" options={[0, 2, 4, 6]} value={v1} onChange={setV1} />
                        )}
                        {mode === 1 && (
                            <ToggleGroup label="B の初速度 v₂ (m/s)" options={[-4, -2, 0, 2, 4, 6]} value={v2} onChange={setV2} />
                        )}
                        {mode === 4 && (
                            <ToggleGroup label="C の質量 m₃ (kg)" options={[1, 2, 3]} value={m3} onChange={setM3} />
                        )}
                    </div>
                    {mode === 1 && (
                        <div className="text-xs text-slate-400">右向きが正。v₂ を負にすると正面衝突、v₂ &lt; v₁ の正なら追突。</div>
                    )}
                    {mode === 4 && (
                        <div className="text-xs text-slate-400">B と C はばねでつながれて静止。A が B に衝突する。</div>
                    )}
                    {is2D && (
                        <>
                            <ToggleGroup label="衝突パターン" options={[1, 2, 3, 4]} value={pattern} onChange={setPattern} />
                            <div className="text-xs text-slate-300 p-2 bg-slate-800 rounded leading-relaxed">
                                {PATTERNS[pattern].desc}
                                <div className="text-slate-500">x は右向き、y は上向きが正</div>
                            </div>
                            {pattern === 1 && (
                                <div>
                                    <div className="text-xs text-slate-400 mb-1">A の上下のずれ：{fmt(offsetC / UNIT, 2)} m（0 で正面衝突）</div>
                                    <input type="range" min={-offMax} max={offMax} step={1} value={offsetC}
                                        onChange={(e) => setOffset(parseFloat(e.target.value))} className="slider-track" />
                                </div>
                            )}
                        </>
                    )}
                    <div>
                        <div className="text-xs text-slate-400 mb-1">反発係数 e = {restitution.toFixed(1)}</div>
                        <input type="range" min={0} max={1} step={0.1} value={restitution}
                            onChange={(e) => setRestitution(parseFloat(e.target.value))} className="slider-track" />
                        <div className="flex justify-between text-[11px] text-slate-500 mt-0.5">
                            <span>0：完全非弾性衝突</span>
                            <span>1：弾性衝突</span>
                        </div>
                    </div>
                </Section>
            );

            const camera = (
                <Section title="カメラの速度">
                    {mode === 1 && (
                        <SnapSlider value={camVx} onChange={setCamVx} snapPoints={snap1D} min={Math.min(-5, v2 - 1)} max={Math.max(7, v1 + 1)} />
                    )}
                    {mode === 2 && (
                        <>
                            <div className="text-xs text-slate-400">向きは V<sub>G</sub> の向きに固定。大きさを変える。</div>
                            <SnapSlider value={camMag} onChange={setCamMag} min={0} max={6}
                                snapPoints={[{ value: 0, label: '0' }, { value: vgMag, label: <>|V<sub>G</sub>|</> }]} />
                        </>
                    )}
                    {mode === 3 && (
                        <div className="space-y-2">
                            <div className="text-xs text-slate-300 bg-slate-800/60 p-2 rounded border border-slate-700 leading-relaxed">
                                <div style={{ color: COLORS.A }}>A：m₁ = {m1} kg、v₁ = ({PATTERNS[pattern].v1.map(x => fmt(x, 1)).join(', ')}) m/s</div>
                                <div style={{ color: COLORS.B }}>B：m₂ = {m2} kg、v₂ = ({PATTERNS[pattern].v2.map(x => fmt(x, 1)).join(', ')}) m/s</div>
                            </div>
                            <div className="text-xs text-slate-400">V<sub>G</sub> の成分を計算して入力（小数第1位まで）</div>
                            <div className="flex gap-3 items-end">
                                <label className="text-xs text-slate-400">x 成分
                                    <input type="number" step="0.1" value={inVx} onChange={(e) => setInVx(e.target.value)}
                                        className={`input-field block mt-0.5 ${Math.abs(cam.vx - vg.x) < 0.15 ? 'correct' : ''}`} />
                                </label>
                                <label className="text-xs text-slate-400">y 成分
                                    <input type="number" step="0.1" value={inVy} onChange={(e) => setInVy(e.target.value)}
                                        className={`input-field block mt-0.5 ${Math.abs(cam.vy - vg.y) < 0.15 ? 'correct' : ''}`} />
                                </label>
                                <span className="text-xs text-slate-400 pb-2">m/s</span>
                            </div>
                            <div className="text-xs text-slate-500">ヒント：V<sub>G</sub> = (m₁v₁ + m₂v₂) / (m₁ + m₂) を成分ごとに</div>
                        </div>
                    )}
                    {mode === 4 && (
                        <>
                            <SnapSlider value={camVx} onChange={setCamVx} min={-1} max={Math.max(7, v1 + 1)}
                                snapPoints={[{ value: 0, label: '0' }, { value: vgSpring, label: <>V<sub>G</sub></> }]} />
                            <div className="text-xs text-slate-400">衝突までカメラは B・C の重心に固定。衝突後この速度で動く。</div>
                        </>
                    )}
                    {mode !== 3 && <div className="text-sm text-center text-slate-300 tabular-nums">{camText}</div>}
                </Section>
            );

            const energy = (
                <Section title="エネルギー" right={<span className="text-[11px] text-slate-500">床から見た値{mode === 4 ? '（B・C の部分）' : ''}</span>}>
                    <div className="space-y-1.5">
                        <EnergyBar label="運動エネルギーの和" sub="K" value={en.K} maxValue={E0} color="#f472b6" />
                        <EnergyBar label="重心の運動" sub={<>½MV<sub>G</sub>²</>} value={en.KG} maxValue={E0} color="#facc15" />
                        <EnergyBar label="相対運動" sub={<>K − ½MV<sub>G</sub>²</>} value={en.Krel} maxValue={E0} color="#38bdf8" />
                        {mode === 4 && <EnergyBar label="弾性エネルギー" sub="½kx²" value={en.U} maxValue={E0} color="#a78bfa" />}
                    </div>
                    {mode === 4 && <div className="text-[11px] text-slate-500">e = 0 で合体した後は A も含む。k = {Math.round(SPRING_K * UNIT * UNIT)} N/m</div>}
                </Section>
            );

            const vgBox = (
                <div className="text-center p-2 bg-slate-800 rounded-lg">
                    <div className="text-xs text-slate-400">
                        {mode === 4 ? <>衝突後の B・C の重心速度 V<sub>G</sub></> : <>重心速度 V<sub>G</sub>（床から見た）</>}
                    </div>
                    {mode === 3 && !(synced || revealVg) ? (
                        <div className="flex items-center justify-center gap-2 py-1">
                            <span className="text-lg font-bold text-yellow-400">？</span>
                            <button onClick={() => setRevealVg(true)} className="text-xs px-2 py-0.5 rounded bg-slate-700 hover:bg-slate-600">答えを見る</button>
                        </div>
                    ) : (
                        <div className="text-lg font-bold text-yellow-400 tabular-nums">
                            {is2D ? `(${fmt(vg.x)}, ${fmt(vg.y)})` : fmt(vg.x)} m/s
                        </div>
                    )}
                </div>
            );

            const panelBody = (
                <div className="space-y-4">
                    {params}
                    {camera}
                    {energy}
                    {vgBox}
                </div>
            );

            const infoOverlay = showInfo && (
                <div className="info-overlay" onClick={() => setShowInfo(false)}>
                    <div className="glass rounded-2xl p-5 max-w-xl mx-4 max-h-[85vh] overflow-y-auto thin-scroll" onClick={(e) => e.stopPropagation()}>
                        <h2 className="text-lg font-bold mb-3">使い方</h2>
                        <div className="space-y-3 text-sm text-slate-300 leading-relaxed">
                            <p>「カメラの速度」を変えると、その速度で動く人から見た運動になります。カメラの速度を重心速度 V<sub>G</sub> に合わせると<strong className="text-green-300">重心系</strong>（重心 G が止まって見える座標系）での観察になります。</p>
                            <div>
                                <strong className="text-white">1D衝突</strong>
                                <p>一直線上の衝突。v₂ を負にすると正面衝突になります。重心系では、衝突の前も後も A と B が G をはさんで逆向きに動き、G からの距離の比が質量の逆比 m₂ : m₁ になっています（「G からの距離」で確認）。e = 1 なら、重心系では衝突の前後で速さが変わりません。</p>
                            </div>
                            <div>
                                <strong className="text-white">2D基本</strong>
                                <p>4 つのパターンの斜め衝突。カメラの向きは V<sub>G</sub> に固定され、大きさをスライダーで変えます。重心系で見ると、衝突の前も後も 2 物体の速度は互いに逆向き（180° ずれる）になっています。</p>
                            </div>
                            <div>
                                <strong className="text-white">2D発展</strong>
                                <p>V<sub>G</sub> の x 成分と y 成分を自分で計算して入力します。正しく入力すると「重心系で観察中」と表示されます。</p>
                            </div>
                            <div>
                                <strong className="text-white">ばね系</strong>
                                <p>ばねでつながれて静止している B・C に、A が衝突します（入試でよく扱われる設定）。e = 0 のとき A と B は一体となって動きます。衝突後、B・C の重心は等速直線運動をします。カメラを V<sub>G</sub> に合わせると、B と C が重心をはさんで逆向きに単振動することがグラフで確認できます。振幅の比は質量の逆比で、m₂ = m₃ のときは対称になります。</p>
                            </div>
                            <div className="pt-2 border-t border-slate-700 text-xs space-y-1">
                                <div><strong className="text-yellow-400">＋ G</strong>：重心</div>
                                <div><strong className="text-yellow-400">→ 実線</strong>：各物体の速度（カメラから見た）</div>
                                <div><strong className="text-yellow-400">→ 破線</strong>：重心 G の速度（カメラから見た）。重心系では消える</div>
                                <div>方眼は 1 マス = 1 m。エネルギーは床から見た値で、運動エネルギーの和 K = ½MV<sub>G</sub>² + 相対運動の部分。衝突で変化するのは相対運動の部分だけです（一直線上の衝突では e² 倍になる）。</div>
                                <div>グラフ：ドラッグで移動、Shift+ドラッグ（または「範囲ズーム」の後にドラッグ）で拡大、ダブルクリックで全体表示。</div>
                            </div>
                        </div>
                        <button onClick={() => setShowInfo(false)} className="mt-4 w-full py-2 rounded-lg bg-slate-600 hover:bg-slate-500 transition">閉じる</button>
                    </div>
                </div>
            );

            if (layout === 'wide') {
                return (
                    <div className="h-screen flex flex-col overflow-hidden">
                        {header}
                        <main className="flex-1 min-h-0 grid gap-3 px-3 pb-3 w-full max-w-[1800px] mx-auto"
                            style={{ gridTemplateColumns: `minmax(0, 1fr) ${window.innerWidth >= 1280 ? 360 : 320}px` }}>
                            <div className="glass rounded-xl overflow-hidden flex flex-col min-h-0">
                                <div className="flex-1 min-h-[160px]">{stage}</div>
                                {actionBar}
                                {hasGraph && <div className="border-t border-slate-700" style={{ height: '38%', minHeight: 150 }}>{graphPanel}</div>}
                            </div>
                            <aside className="glass rounded-xl p-3 overflow-y-auto thin-scroll min-h-0">
                                {panelBody}
                            </aside>
                        </main>
                        {infoOverlay}
                    </div>
                );
            }

            // スマホ・縦長画面：表示部を上に固定し、その下の操作部をスクロール
            return (
                <div className="min-h-screen pb-4">
                    {header}
                    <div className="sticky top-0 z-20 px-3 pt-1 pb-2" style={{ background: 'rgba(15, 23, 42, 0.92)' }}>
                        <div className="glass rounded-xl overflow-hidden">
                            <div style={{ height: '34vh', minHeight: 170 }}>{stage}</div>
                            {actionBar}
                        </div>
                    </div>
                    <div className="px-3 space-y-3">
                        {hasGraph && <div className="glass rounded-xl overflow-hidden" style={{ height: 250 }}>{graphPanel}</div>}
                        <div className="glass rounded-xl p-3">{panelBody}</div>
                    </div>
                    {infoOverlay}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
